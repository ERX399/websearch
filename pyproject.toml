[project]
name = "websearch"
version = "2.0.0"
description = "免 Key 的多引擎联网搜索插件，自带广告与山寨站过滤"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["aiohttp>=3.9.0"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["F", "W", "E", "ASYNC", "C4", "Q", "I", "UP"]
ignore = ["F403", "F405", "E501", "ASYNC230", "ASYNC240"]
